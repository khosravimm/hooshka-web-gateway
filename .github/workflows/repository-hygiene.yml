name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - develop
      - master
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  tracked-artifact-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject tracked runtime and dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|/)(\.runtime($|/)|\.runtime-[^/]+/|\.pytest_tmp/|node_modules/|\.venv/|venv/|logs/|component_crx_cache/|\.env$)'
          forbidden="$(git ls-files | grep -E "$pattern" || true)"
          if [[ -n "$forbidden" ]]; then
            echo 'Forbidden tracked artifacts detected:'
            printf '%s\n' "$forbidden"
            exit 1
          fi
