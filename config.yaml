server:
  host: 127.0.0.1
  port: 5000
  debug: false
cdp:
  url: http://127.0.0.1:9222
  timeout: 30000
providers:
- id: chatgpt-web
  type: chatgpt_web
  enabled: true
  priority: 100
  config:
    cdp_url: http://127.0.0.1:9222
    chatgpt_url: https://chatgpt.com
    adapter: dom
    headless: false
    timeout: 120
    long_text_chunk_size: 2048
  capabilities:
    chat_completion: true
    streaming: true
    streaming_mode: buffered
    tools: true
    vision: false
    embeddings: false
    max_context_tokens: 128000
    supported_models:
    - chatgpt-web
- id: qwen-web
  type: qwen_web
  enabled: true
  priority: 90
  config:
    transport_mode: browser_controller
    default_upstream_model: qwen3.8-max
    profile_dir: .runtime\qwen-profile
    runtime_label: HWG-Qwen-Web-Controller
    browser_channel: chrome
    headless: true
    launch_timeout: 45
    first_event_timeout: 30
    idle_timeout: 45
    total_timeout: 180
    poll_interval: 0.08
    requests_per_minute: 12
  capabilities:
    chat_completion: true
    streaming: true
    streaming_mode: reconstructed
    tools: false
    vision: false
    embeddings: false
    max_context_tokens: 1000000
    supported_models:
    - qwen-web
    search: false
    reasoning: true
    files: false
    transport_mode: browser_backend_controller
- id: zai-web
  type: zai_web
  enabled: true
  priority: 80
  config:
    base_url: https://chat.z.ai
    frontend_version: prod-fe-1.1.93
    default_upstream_model: glm-5.3
    runtime_label: HWG-Zai-Web-SSE-Capture
    profile_dir: .runtime\zai-profile
    transport_mode: browser_ui_capture
    cdp_url: http://127.0.0.1:9223
    first_event_timeout: 120
    idle_timeout: 180
    total_timeout: 420
    poll_interval: 0.25
    connect_timeout: 10
    header_timeout: 30
    requests_per_minute: 6
  capabilities:
    chat_completion: true
    streaming: true
    streaming_mode: buffered_sse_capture
    tools: false
    vision: false
    embeddings: false
    max_context_tokens: 128000
    supported_models:
    - zai-web
    search: false
    reasoning: true
    files: false
    transport_mode: browser_frontend_backend_sse_capture
governance:
  auth:
    enabled: true
    # Runtime key is supplied via BRIDGE_API_KEY in the Windows service
    # environment. Never store bearer credentials in this tracked file.
    api_keys: {}
  rate_limiting:
    enabled: true
    default_requests_per_minute: 60
    per_provider:
      chatgpt-web:
        requests_per_minute: 20
      qwen-web:
        requests_per_minute: 12
      zai-web:
        requests_per_minute: 6
  audit:
    enabled: true
    output: logs/audit.log
    format: json
    retention_days: 90
  policies:
    enabled: false
    engine: opa
    bundle_path: policies/
logging:
  level: INFO
  file: logs/bridge.log
  format: '%(asctime)s - %(levelname)s - %(message)s'
  max_bytes: 10485760
  backup_count: 5
